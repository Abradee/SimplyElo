name: SimplyElo
description: $description
prefix: SimplyElo
version: '1.3.0-BUILD-7'
softdepend: [PlaceholderAPI]

main: io.github.abradee.simplyElo.SimplyElo
paper-plugin-loader: io.github.abradee.simplyElo.SimplyEloLoader
api-version: '26.2'
load: POSTWORLD

commands:
  setrank:
    description: Sets a player's Elo to the baseline of a specific rank.
    aliases: [changerank]
    permission: simplyelo.admin.setrank
    usage: /setrank <player> <rank>
  viewelo:
    description: View your Elo or another player's Elo rating.
    usage: /<command> [player]
    aliases: [checkelo]
    permission: simplyelo.command.viewelo
  resetelo:
    description: Reset a player's Elo rating to default.
    usage: /<command> [player]
    permission: simplyelo.admin.reset
  eloreload:
    description: Reloads the SimplyElo config and ranks.
    usage: /eloreload
    permission: simplyelo.admin.reload



permissions:
  simplyelo.command.viewelo:
    description: Allows viewing Elo ratings.
    default: true
  simplyelo.admin.reset:
    description: Allows resetting a player's Elo rating.
    default: op
  simplyelo.admin.reload:
    description: Allows reloading the plugin configuration.
    default: op
  simplyelo.admin.setrank:
    description: Allows setting a player's rank.
    default: op

authors: [ abradee ]
website: https://modrinth.com/plugin/SimplyElo